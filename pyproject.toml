# Coldline - Task 4.8
# File: pyproject.toml
# Component: Python project contract
# Purpose: Define one installable project, pinned tools, tests, and Poe commands.
# Interacts With: src packages, tests, uv.lock
# Sprint/Task: Sprint 4 - Project 4 / Task 4.8
# Concepts: Single-project reproducibility, a gRPC intake beside the JSON one, generated code
# Tools: uv, Hatchling, Poe, Ruff, mypy, pytest, jsonschema, grpcio-tools

[project]
name = "coldline-task-2-1"
version = "0.1.0"
description = "Coldline Sprint 4 AI security, guardrails, and governance project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.17.1",
  "asyncpg==0.31.0",
  "boto3==1.42.5",
  "opentelemetry-api==1.44.0",
  "opentelemetry-exporter-otlp==1.44.0",
  "opentelemetry-instrumentation-redis==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "prometheus-client==0.26.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "redis==5.3.1",
  "sqlalchemy==2.0.44",
  # Task 4.5: urllib3 reaches both images through botocore. The release the earlier
  # checkpoints locked carries a published high-severity vulnerability under the current
  # database, which the gate must not inherit; the pin names the fixed release.
  "urllib3==2.8.0",
]

[dependency-groups]
api = [
  # Task 4.2: the supplied TokenVerifier checks RS256 signatures with PyJWT, which needs
  # cryptography for RSA. PyJWT was already in the lock (redis depends on it); the pin
  # makes the API's own dependency explicit. Task 4.5 raised it to the release that
  # fixes the vulnerabilities published against the earlier pin; cryptography likewise.
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  # Add-On Task 4.8: the API serves the gRPC reading intake (grpcio's asyncio server) and its
  # image generates the Python code for proto/ when it is built (grpcio-tools bundles
  # protoc). grpcio and protobuf were already in the lock through the OTLP exporter; the
  # pins make the API's own dependency explicit at the versions the lock resolved, and
  # grpcio-tools is pinned to the grpcio release it was built with.
  "grpcio==1.83.1",
  "grpcio-tools==1.83.1",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "protobuf==7.36.1",
  "pyjwt==2.15.0",
  "pyyaml==6.0.3",
  "uvicorn==0.52.4",
]
worker = [
  # Task 4.3: the supplied output guardrail validates the provider's answer against
  # schemas/exception-summary.schema.json inside the worker, so the validator ships in
  # the worker image. The same pin was already in the dev group. Task 4.4's redactor and
  # Task 4.5's secret adapter (boto3, a project dependency) add nothing here.
  "jsonschema==4.26.0",
]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "locust>=2.31",
  "mypy==2.3.1",
  "poethepoet==0.48.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pyyaml==6.0.3",
  "ruff==0.16.3",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/worker", "src/domain", "src/ports", "src/adapters", "src/common"]

[tool.uv]
default-groups = ["api", "worker", "dev"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "runtime: requires the running Docker Compose stack",
  "assessed: checks student work this Task assesses, so a fresh starter is expected to fail it",
  "submission_boundary: asserts a student submission stays inside this Task's editable paths",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "src",
  "infra/issuer",
  "infra/scripts",
  "tests/security",
  "tests/contract/authoring.py",
  "tests/contract/runtime_adapters.py",
  "tests/contract/retrieval_runtime.py",
  "tests/contract/submission_validation.py",
  "tests/contract/threat_model.py",
  "tests/contract/slo_alert.py",
  "tests/contract/reliability_gate.py",
  "tests/contract/runbook_contract.py",
  "tests/contract/fidelity_check.py",
  "tests/smoke/readiness.py",
  "tests/e2e/scenario.py",
  "tests/e2e/baseline.py",
  "tests/golden.py",
  "tests/doubles",
  "tests/benchmark",
  "tests/regression.py",
  "tests/diagnostics",
  "tests/failure",
]

[[tool.mypy.overrides]]
# These runtime libraries do not publish complete typing metadata.
# Typed boundary wrappers keep their use inside adapters and configuration modules.
# Add-On Task 4.8 adds the gRPC runtime, its code generator and the Protobuf runtime.
module = [
  "asyncpg",
  "boto3",
  "botocore",
  "botocore.*",
  "google.protobuf",
  "google.protobuf.*",
  "grpc",
  "grpc.*",
  "grpc_tools",
  "grpc_tools.*",
  "jsonschema",
  "yaml",
]
ignore_missing_imports = true

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "mypy"
unit = "pytest tests/unit"
contract = "pytest tests/contract -m 'not runtime and not assessed'"
runtime-contract = "pytest tests/contract -m runtime"
queue-contract = "pytest tests/contract/test_runtime_adapters.py -m runtime"
# Task 3.4's own automated check: the deployed alert rule's bound, firing, and resolution.
slo-contract = "pytest tests/contract/test_slo_alert.py -m runtime"
# Task 3.5's own automated check: the wired reliability-gate job's static shape, plus a
# live proof that it actually rejects its own Task's known starting-broken value.
gate-contract = "pytest tests/contract/test_reliability_gate.py -m runtime"
# Task 3.6's automated check, inherited unchanged over the supplied, settled runbook and
# fidelity record: it must pass as shipped, and a failure here means the checkpoint, not
# the student's work, needs attention. Static, needs no stack.
runbook-contract = "pytest tests/contract/test_runbook_contract.py tests/contract/test_fidelity_check.py"
fidelity-check = "pytest tests/contract/test_fidelity_check.py"
smoke = "pytest tests/smoke -m runtime"
# Task 4.1: the end-to-end workflow retrieves a procedure for every summary, so the corpus must
# be ingested first. Ingest is idempotent; running it here keeps `poe e2e` correct on its own
# (for example straight after `poe start`), not only inside `poe verify`. `e2e-tests` is the
# bare pytest run: it forwards extra arguments (`poe e2e-tests -k <name>`), and checks after a
# restart use it so a corpus lost across the restart is not silently re-ingested.
e2e-tests = "pytest tests/e2e -m runtime"
e2e = ["ingest", "e2e-tests"]
telemetry-repair = "pytest tests/contract/test_telemetry_repair.py -m runtime"
retrieval-runtime = "pytest tests/contract/test_retrieval_runtime.py -m runtime"
# Alembic diagnostics. The initializer already brings the schema to head on
# every start, so these are for inspecting and stepping that state by hand.
migrate = "docker compose --profile observability --profile localstack exec -T api alembic upgrade head"
migrate-down = "docker compose --profile observability --profile localstack exec -T api alembic downgrade -1"
migrate-current = "docker compose --profile observability --profile localstack exec -T api alembic current"
# The experiment harness. One command per arm, one retained report per
# capture, so the baseline evidence survives an experiment run: see
# docs/contracts/benchmark-report.schema.json for the retained report contract.
# `compare` re-measures nothing - it reads those two reports and applies the
# published adoption rule from config/adoption-policy.yaml.
benchmark-baseline = "python -m tests.benchmark.run --arm baseline"
benchmark-experiment = "python -m tests.benchmark.run --arm experiment"
compare = "python -m tests.benchmark.compare"
# Re-measures both arms and prints the drift from the retained reports. It
# writes nothing and grades nothing; a recorded decision keeps the evidence it
# was graded against.
benchmark-reproduce = "python -m tests.benchmark.reproduce"
# The retained-report validation, which assesses nothing and needs no
# container: a missing or self-inconsistent report must fail validation rather
# than become a decision.
report-contract = "pytest tests/contract/test_benchmark_reports.py"
# The intermediate stage inspector, kept as Part 3 evidence for the defense.
diagnose = "python -m tests.diagnostics.inspect"
authorization-checkpoint = "pytest tests/contract/test_authorization_checkpoint.py -m runtime"
# Every test under tests/student/: yours, test_grpc_ingest.py, which calls the running API's
# gRPC port and summary endpoint, beside the carried completions (the Task 4.2 access tests,
# the Task 4.3 guardrail and audit tests, and the Task 4.4 redaction tests), the checks on
# the controls you inherited. Start the stack first, and run `poe restart-api` after an edit
# to src/api/grpc_ingest.py or the .proto so the API serves what you wrote.
student-tests = "pytest tests/student"
test = ["unit", "contract"]
preflight = "python infra/scripts/preflight.py"
start = "docker compose --profile observability --profile localstack up --build --wait"
ready = "python -m tests.smoke.readiness"
ingest = "docker compose --profile observability --profile localstack exec -T api python -m api.ingest"
baseline = "python -m tests.e2e.baseline"
# Task 4.4's Step 1 tool, kept: one supplied out-of-range reading through the running stack,
# with a fresh identity each run, the emulator response you choose (`--response
# valid|malformed|manipulated|pii-echo`; `valid` is the default) and, with `--note <id>`,
# one of the supplied handling notes in place of the reading's own. It prints the exception
# id, the finished state, and the trace ids.
scenario = "python -m tests.e2e.scenario"
# Task 4.6's Step 1 tool, kept because a Task 6 evidence entry may cite it; not part of
# `poe verify`. It sends the supplied development attack scenario
# (tests/fixtures/attacks/development.json) through the running stack as one combined
# attack and writes evidence/attack-dev.json with four stages: `token_check`,
# `output_schema`, `redactor` and `audit_trail`. The evidence for Task 7 is the stage summary
# you recorded at Task 6's accepted commit; a run here is not that record. It needs the
# running stack and exits 0 whatever the outcomes; exit 2 means the run could not be made.
attack-dev = "python -m tests.security.attack_dev"
# Task 4.5's secret tools, kept for diagnosis and for the evidence index. None prints a
# value. The gate tools (`security-setup`, `security-scan`, the two seeds) stay as supplied:
# the security-gate job still runs `poe security-scan` on every pull request with the settled
# thresholds and suppression, and the clean tree passes it.
secret-status = "python -m tests.security.secret_tools status"
secret-replace = "python -m tests.security.secret_tools replace"
secret-check-old = "python -m tests.security.secret_tools check-old"
provider-auth-check = "docker compose --profile observability --profile localstack exec -T worker python -m worker.provider_auth"
security-setup = "python -m tests.security.security_setup"
security-scan = "python -m tests.security.security_scan"
seed-secret = "python -m tests.security.seeds secret"
seed-vulnerable = "python -m tests.security.seeds vulnerable"
# The hosted jobs' failure handler. It never prints `docker compose logs` raw: it reads every
# version the store holds, replaces each value in every service's log text with
# `[provider-key version <id>]`, and prints one group per service; when the versions cannot
# be read it prints a diagnostic and withholds the logs. Usable locally after a failed run.
runtime-logs = "python -m tests.security.runtime_logs"
# Task 4.4's and Task 4.3's tools, kept for diagnosis: `audit-trail <exception_id>` prints one
# exception's audit records in order; `pii-scan <exception_id>` searches the worker logs, the
# model request, the audit records and the stored summary for the marked values of a run's
# supplied note and response and prints what it found where, by label; `redaction-report`
# prints every supplied note's original text, redacted text and marked values;
# `model-request <exception_id>` prints the recorded request text. `token-check`,
# `auth-checks` and `auth-config` are Task 4.2's tools over the settled config/auth.yaml.
pii-scan = "python -m tests.security.pii_scan"
redaction-report = "python -m tests.security.redaction_report"
model-request = "docker compose --profile observability --profile localstack exec -T worker python -m worker.model_request"
audit-trail = "docker compose --profile observability --profile localstack exec -T api python -m api.audit_trail"
token-check = "python -m tests.security.token_check"
auth-checks = "python -m tests.security.auth_checks"
auth-config = "python -m tests.security.auth_config"
# `integrity-record` and `integrity-check` are the first and last steps of `poe verify`: the
# first hashes the answer sheet and every trusted file the checks rely on into a snapshot
# outside the repository, the last recomputes them and fails, naming the file, if anything
# changed while the run was in progress.
integrity-record = "python -m tests.security.integrity record"
integrity-check = "python -m tests.security.integrity check"
# Add-On Task 4.8's answer sheet, in two forms. `answers` is the answer sheet's format only:
# the two status names, the two sizes as positive whole numbers, a listed recommendation and
# a list of distinct listed gaps, and not a copy of the sample. `submission` is the same
# module in full: the format plus the permitted-files boundary (the diff from the merge base
# touches only the .proto, src/api/grpc_ingest.py, tests/student/test_grpc_ingest.py and
# submission.yaml). Both are static and need no stack.
answers = "python -m tests.contract.submission_validation --format-only"
submission = "python -m tests.contract.submission_validation"
# Add-On Task 4.8's tools. `proto-gen` generates the Python code for
# proto/coldline/ingest/v1/ingest.proto into the Git-ignored .generated/grpc/ directory (the
# API image generates it again when it is built). `proto-check` compiles the .proto as it is
# now and compares it with docs/contracts/ingest-grpc.md, item by item. `grpc-call --token
# <fixture> [--reading malformed]` sends the supplied reading (a fresh reading_id each run)
# to SubmitReading on the gRPC port and prints the status. `payload-size` prints the
# supplied reading's size as JSON and as Protobuf once your .proto matches the contract.
# `read-exception <exception_id> [--token <fixture>]` reads one exception through the
# protected summary endpoint, as dispatcher-valid by default. `restart-api` rebuilds the API
# image from this checkout and recreates the API container alone: run it after an edit to
# src/api/grpc_ingest.py or the .proto (`poe restart` restarts without rebuilding, so it
# would keep serving the old code).
proto-gen = "python -m api.grpc_codegen"
proto-check = "python -m tests.security.proto_check"
grpc-call = "python -m tests.security.grpc_calls"
payload-size = "python -m tests.security.payload_size"
read-exception = "python -m tests.security.exception_read"
restart-api = "docker compose --profile observability --profile localstack up --build --wait --no-deps api"
# Add-On Task 4.8's assessed module: the .proto against the contract, the four calls, the
# shared acceptance path, the two recorded statuses against this run's calls, the answer
# formats, and your two tests as written and under the four interceptor mutations. Needs the
# running stack. `grpc-mutation` prints the inventory of your tests and the four mutation
# verdicts on their own, then restores the API container.
grpc-contract = "pytest tests/contract/test_grpc_ingest_contract.py"
grpc-mutation = "python -m tests.security.grpc_mutation"
structure = "python -m tests.contract.authoring"
compose-config = "docker compose --profile observability --profile localstack config --quiet"
# Project 3's own failure exercises, unchanged and still runnable; not part of this Task.
worker-stop = "docker compose --profile observability --profile localstack stop worker"
worker-start = "docker compose --profile observability --profile localstack start worker"
inject-failure = "python -m tests.failure.force_dlq_arrival"
redrive = "python -m tests.failure.redrive_and_verify"
trigger-alert-load = "python -m tests.failure.trigger_alert_load"
verify-alert-recovery = "python -m tests.failure.verify_alert_recovery"
dev-failure-lab = "python -m tests.failure.dev_failure_lab"
# Order matters here, and follows the lesson. `integrity-record` and `integrity-check`
# bracket the run: the files every step judged must be the files the run finished with.
# The answer sheet's format and the permitted-files boundary come first, so a boundary
# violation is reported before anything else runs. The unit tests run before the stack
# builds. Then the stack starts (its API image generates the gRPC code from your .proto and
# serves your method), the corpus is ingested, `proto-gen` and `proto-check` run on the host,
# and `grpc-contract` sends the gateway-valid, dispatcher-valid, expired and malformed calls,
# compares your two recorded statuses with the gateway-valid and dispatcher-valid results,
# and runs your tests with the interceptor in place and under its four mutations. Last, the
# checks on the controls you inherited run again: the running platform (`smoke`), the
# end-to-end workflow (`e2e-tests`) and every test under tests/student/ (`student-tests`).
verify = [
  "integrity-record",
  "answers",
  "submission",
  "unit",
  "start",
  "ready",
  "ingest",
  "proto-gen",
  "proto-check",
  "grpc-contract",
  "smoke",
  "e2e-tests",
  "student-tests",
  "integrity-check",
]
author-verify = [
  "format-check",
  "lint",
  "typecheck",
  "unit",
  "contract",
  "structure",
  "compose-config",
]
dogfood-verify = [
  "author-verify",
  "ready",
  "ingest",
  "runtime-contract",
  "smoke",
  "e2e",
  "scenario",
  "baseline",
  "restart",
  "ready",
  "e2e-tests",
  "reset",
]
restart = "docker compose --profile observability --profile localstack restart api worker"
# Compose's `up` (what `poe start` runs) only recreates a container when the
# container's own configuration changes (image, environment, build args, and
# so on); it does not track bind-mounted file content, so editing
# `infra/observability/alerts.yml` and running `poe start` again never makes
# Prometheus re-read it. This restarts just the Prometheus container so it
# reloads its rule file.
reload-alerts = "docker compose --profile observability --profile localstack restart prometheus"
reset = "docker compose --profile observability --profile localstack down --volumes --remove-orphans"
stop = "docker compose --profile observability --profile localstack down --remove-orphans"
load-test = "locust -f loadtest/locustfile.py --headless --users 2 --spawn-rate 2 --run-time 30s --host http://localhost:${COLDLINE_API_HOST_PORT:-8000}"
reset-baseline = { shell = "docker compose --profile observability --profile localstack exec -T postgres psql -U coldline -d coldline -c \"TRUNCATE exceptions;\" && docker compose --profile observability --profile localstack exec -T redis redis-cli FLUSHDB && docker compose --profile observability --profile localstack restart worker" }
